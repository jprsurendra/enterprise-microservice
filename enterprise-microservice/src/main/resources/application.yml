# ===== SpringDoc / Swagger UI =====
springdoc:
  api-docs:
    path: /api-docs              # Raw OpenAPI JSON spec at /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI browser interface
    enabled: true
    operations-sorter: method    # Sort endpoints by HTTP method
    tags-sorter: alpha           # Sort tags alphabetically
    display-request-duration: true
    try-it-out-enabled: true     # Enable "Try it out" button by default
    filter: true                 # Enable search/filter bar
  show-actuator: false           # Don't pollute docs with actuator endpoints
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.enterprise.microservice.controller

spring:
  application:
    name: enterprise-microservice
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EnterpriseHikariPool
  jpa:
    hibernate:
      ddl-auto: validate          # Never 'update' in any real environment
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false         # Disabled by default; override in dev profile below
    show-sql: false               # Disabled by default; override in dev profile below
  security:
    jwt:
      secret: ${JWT_SECRET}       # No fallback default — must be set explicitly
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      issuer: enterprise-microservice

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never        # Never leak Spring's default error messages
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized   # Not 'always' — requires ROLE_ACTUATOR
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [traceId=%X{traceId}] [ip=%X{clientIp}] - %msg%n"
  level:
    root: WARN
    com.enterprise.microservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN      # Disabled by default

---
# ===== DEV Profile =====
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update            # Permissive in local dev only

logging:
  level:
    com.enterprise.microservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# ===== PROD Profile =====
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.enterprise.microservice: WARN
    org.springframework.security: WARN