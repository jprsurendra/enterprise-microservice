spring:
  application:
    name: enterprise-microservice           # logical name of Application: It will use in Logs, Monitoring tools, service identification in Microservices environment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # if Environment Variable SPRING_PROFILES_ACTIVE not set, then use ==> default profile = dev
  datasource:    # Database Configuration
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}          # if DB_USERNAME not found then use root as username
    password: ${DB_PASSWORD:}              # DB_PASSWORD use if found, otherwise empty password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:                                # Hikari = default connection pool of Spring Boot
      maximum-pool-size: 10                # limit: 10 DB Connections at a time
      minimum-idle: 2                      # At least  2 connections will remain ready, so that a DB call can be made as soon as a request arrives.
      connection-timeout: 30000            # 30-second wait, Exception if the connection is not established.
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EnterpriseHikariPool
  jpa:                                     # Hibernate/JPA settings
    hibernate:
      ddl-auto: validate                   # This is an important setting; Never 'update' in any real/Production environment ('validate' means verifying the tables structure & entities without creating or updating it.)
                                           # Other options: create, create-drop, update, validate, none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false         # Disabled by default; override in dev profile below
    show-sql: false               # Disabled by default, In Production environment SQL hide. Reason: Security, Performance, Clean logs
  security:
    jwt:
      secret: ${JWT_SECRET}       # No fallback default — must be set explicitly  set in .env, Very Important Key for signing the JWT.
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # Token expires after 3600000 ms = 60 minutes = 1 hour
      issuer: enterprise-microservice               # Which application created the token?

server:                                     # Server Configuration
  port: ${SERVER_PORT:8080}
  error:
    include-message: never        # Never leak Spring's internal error messages
    include-stacktrace: never
    include-binding-errors: never
  #    include-message: never & include-stacktrace: never are Excellent production practice.
  # Bad Response: { "exception":
  #                  "NullPointerException at UserService line 44"
  #               }
  #
  #  The hacker obtained the internal details.
  #
  # Current Setting: { "status":500 }
  #
  #  Safe।

# ===== Spring Boot Actuator =====
management:                     # Actuator: Application Monitoring; Endpoint: /actuator/health  Response: { "status":"UP" }  Useful for: Kubernetes, Docker, Monitoring tools
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized   # Requires ROLE_ADMIN — not 'always'
      probes:
        enabled: true
  info:
    env:
      enabled: true

# ===== SpringDoc / Swagger UI =====
springdoc:                    # Swagger Configuration
  api-docs:
    path: /api-docs                   # OpenAPI JSON spec → http://localhost:8080/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html            # Swagger UI → http://localhost:8080/swagger-ui.html
    enabled: true
    operations-sorter: method         # Sort endpoints by HTTP method (GET, POST, PUT, DELETE)
    tags-sorter: alpha                # Sort tags alphabetically
    display-request-duration: true    # Show response time in Try it out results
    try-it-out-enabled: true          # "Try it out" button active by default
    filter: true                      # Show search/filter bar at the top
  show-actuator: false                # Keep actuator endpoints out of API docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.enterprise.microservice.controller   # Swagger will only scan controllers.

# ===== Default Logging =====
logging:
  pattern:                         # This defines the log format. traceId: Tracking a single request is difficult. The TraceId allows the entire flow to be tracked.
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [traceId=%X{traceId}] [ip=%X{clientIp}] - %msg%n"
  level:
    root: WARN
    com.enterprise.microservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN      # Disabled by default

---
# ==============================================================
# DEV Profile — permissive, verbose, full Swagger enabled
# ==============================================================
spring:
  config:
    activate:
      on-profile: dev              # dev: Local Development
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update              # Permissive (Auto-create/alter tables) in local dev only

logging:
  level:
    com.enterprise.microservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # Logs actual SQL bind parameter values

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

---
# ==============================================================
# UAT Profile — production-like but Swagger still accessible
# for QA team and integration testing
# ==============================================================
spring:
  config:
    activate:
      on-profile: uat
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.enterprise.microservice: DEBUG   # Verbose for UAT debugging
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    enabled: true                        # QA team needs Swagger in UAT
  api-docs:
    enabled: true

---
# ==============================================================
# PROD Profile — hardened, Swagger fully disabled
# ==============================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.enterprise.microservice: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    enabled: false                       # Swagger UI completely off in production
  api-docs:
    enabled: false                       # OpenAPI spec endpoint completely off in production